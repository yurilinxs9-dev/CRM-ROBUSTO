events {
    worker_connections 1024;
}

http {
    upstream backend {
        server crm-backend:3001;
    }

    # CRM
    server {
        listen 80;
        server_name crm-yuridev.duckdns.org yurilinscrm.duckdns.org;

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }

    # CRM HTTPS
    #
    # NÃO REMOVER. Sem estes dois blocos, qualquer requisição HTTPS para os
    # domínios do CRM cai no primeiro server de 443 (o do nuuvemquinze), recebe
    # o certificado errado e é entregue ao app Python da porta 5555.
    #
    # Foi o que aconteceu entre 14/08/2026 e 17/08/2026: o Evolution abortava no
    # TLS (certificado com CN errado) e a UazAPI levava 405 do Flask. Resultado:
    # o CRM parou de receber mensagem por 3 dias, sem erro visível no backend.
    #
    # Um bloco por domínio porque cada um tem certificado próprio — um único
    # server não consegue servir dois certificados de hostnames diferentes.
    # Os location são cópia fiel do bloco :80 acima; se mexer lá, mexa aqui.
    server {
        listen 443 ssl;
        server_name crm-yuridev.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/crm-yuridev.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/crm-yuridev.duckdns.org/privkey.pem;

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }

    server {
        listen 443 ssl;
        server_name yurilinscrm.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/yurilinscrm.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yurilinscrm.duckdns.org/privkey.pem;

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }

    # HFSE HTTP -> HTTPS
    server {
        listen 80;
        server_name nuuvemquinze.com www.nuuvemquinze.com;
        return 301 https://$server_name$request_uri;
    }

    # HFSE HTTPS
    server {
        listen 443 ssl;
        server_name nuuvemquinze.com www.nuuvemquinze.com;

        ssl_certificate /etc/letsencrypt/live/nuuvemquinze.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nuuvemquinze.com/privkey.pem;

        location / {
            proxy_pass http://172.17.0.1:5555;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # AdAgency painel (host uvicorn :8000)
    server {
        listen 80;
        server_name painel.gestaorm.online;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        server_name painel.gestaorm.online;

        ssl_certificate /etc/letsencrypt/live/painel.gestaorm.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/painel.gestaorm.online/privkey.pem;

        client_max_body_size 25M;

        location / {
            proxy_pass http://172.18.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
