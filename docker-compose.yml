version: '3.8'
services:
  crm-redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    command: >
      redis-server --maxclients 1000 --appendonly yes --appendfsync everysec --save "3600 1 300 100 60 10000" --bind 0.0.0.0 --protected-mode no
    volumes:
      - crm-redis-data:/data
    networks: [crm-network]

  crm-backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: crm-backend
    restart: always
    ports: ["3001:3001"]
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - REDIS_URL=${REDIS_URL}
      - UAZAPI_BASE_URL=${UAZAPI_BASE_URL}
      - UAZAPI_ADMIN_TOKEN=${UAZAPI_ADMIN_TOKEN}
      # Provider alternativo por instância (config.provider = evolution).
      # Estavam no .env da VPS mas não eram repassadas ao container: enviar por
      # uma instância Evolution falhava com "sem URL da API".
      - EVOLUTION_BASE_URL=${EVOLUTION_BASE_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      # Descriptografa as chaves de IA em repouso (AES-256-GCM). Sem ela o
      # módulo ai/ não consegue usar nenhum modelo — o que inclui o follow-up
      # em modo IA.
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY}
      # Allowlist de hosts de IA. SUBSTITUI a lista default do codigo — mantida
      # completa aqui + api.z.ai (GLM-5, saldo pago do Yuri, 2026-08-26).
      - AI_ALLOWED_HOSTS=api.anthropic.com,api.openai.com,openrouter.ai,api.groq.com,api.deepseek.com,api.mistral.ai,api.x.ai,api.together.xyz,generativelanguage.googleapis.com,api.z.ai
      - WEBHOOK_PUBLIC_URL=${WEBHOOK_PUBLIC_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-crm-media}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-7d}
      - JWT_REFRESH_EXPIRY_REMEMBER=${JWT_REFRESH_EXPIRY_REMEMBER:-365d}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=${FFPROBE_PATH:-/usr/bin/ffprobe}
      - TMP_VIDEO_DIR=${TMP_VIDEO_DIR:-/tmp/video}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Audio PTT (Phase 1)
      - UAZAPI_PTT_FIELD=${UAZAPI_PTT_FIELD:-ptt}
      - AUDIO_SEND_STRATEGY=${AUDIO_SEND_STRATEGY:-auto}
      # Sentry (Phase 3) — deixe SENTRY_DSN vazio para desabilitar
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENV=${SENTRY_ENV:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      - SENTRY_PROFILES_SAMPLE_RATE=${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
    depends_on: [crm-redis]
    networks: [crm-network]
    deploy:
      resources:
        limits: { memory: 2G, cpus: '0.8' }
        reservations: { memory: 1G }

  nginx:
    image: nginx:alpine
    container_name: crm-nginx
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [crm-backend]
    networks: [crm-network]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    ports: ["3002:3001"]
    volumes: [uptime_data:/app/data]
    networks: [crm-network]

  # LLM local para os insights de lead (spec 2026-08-25-lead-insights).
  # Sem porta publicada: acesso so pela rede interna (http://ollama:11434).
  # mem_limit 3g: VPS tem 7.8G e o Evolution ja consome ~1.4G.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks: [crm-network]
    environment:
      # Default (2k/4k) trunca o prompt de 40 mensagens pelo INICIO e come o
      # system prompt — o modelo passa a responder prosa em vez de JSON.
      # 8192 cobre o prompt do insight; KV cache do 3B q4 cabe no limite de 3g.
      - OLLAMA_CONTEXT_LENGTH=8192
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 3g
          # 1.5 de 2 vCPUs: geracao continua (backfill) nunca sufoca webhooks/API.
          cpus: "1.5"

volumes:
  uptime_data:
  crm-redis-data:
  ollama-data:

networks:
  crm-network:
    driver: bridge
